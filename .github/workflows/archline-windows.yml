# ArchLine: compila su Windows e pubblica l'eseguibile come artefatto scaricabile
# (Actions -> run -> Artifacts). Nessun segreto richiesto; non firma e non crea release.
name: ArchLine Windows build

on:
  push:
    branches: ["claude/**", "lavoro"]
  workflow_dispatch:

concurrency:
  group: archline-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --locked --release --bin ArchLine

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\ArchLine.exe dist\ArchLine.exe
          $info = "ArchLine build`ncommit: ${{ github.sha }}`nbranch: ${{ github.ref_name }}`n"
          Set-Content -Path dist\BUILD.txt -Value $info

      # Installer MSI (WiX 3), non firmato: Windows SmartScreen avvisa al primo avvio.
      # Se l'immagine non ha WiX 3 si scarica lo zip dei binari (stessa versione usata in locale).
      - name: Installer MSI
        shell: pwsh
        run: |
          $wix = $env:WIX
          if (-not $wix -or -not (Test-Path (Join-Path $wix 'bin\candle.exe'))) {
            $zip = Join-Path $env:RUNNER_TEMP 'wix314.zip'
            Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile $zip
            $wix = Join-Path $env:RUNNER_TEMP 'wix3'
            Expand-Archive $zip $wix
          }
          pwsh packaging/archline-windows/build-msi.ps1 -Wix $wix -Out installer
          if ($LASTEXITCODE -ne 0) { throw "build-msi fallito" }

      - uses: actions/upload-artifact@v4
        with:
          name: ArchLine-installer-${{ github.run_number }}
          path: installer
          retention-days: 14

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Misura, non blocca: il report entra nell'artefatto. Per promuoverlo a cancello, togliere continue-on-error.
      # ezdxf e' bloccato alla versione con cui e' stato misurato expected.json (un'altra puo' dare regressioni spurie).
      # Due passi separati: in pwsh un comando nativo che fallisce non ferma il successivo, e il passo prende
      # solo l'exit code dell'ultimo, quindi i test rossi del banco verrebbero nascosti da run.py.
      - name: Conformance, test del banco
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install "ezdxf==1.4.4"
          python -m unittest discover -s tests/conformance -p "test_*.py"

      - name: Conformance, misura (ezdxf come oracolo)
        continue-on-error: true
        shell: pwsh
        run: python tests/conformance/run.py target\release\ArchLine.exe --out dist\conformance-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: ArchLine-windows-${{ github.run_number }}
          path: dist
          retention-days: 14
